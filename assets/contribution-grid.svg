<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
<title>Sentinel infinity circuit</title><desc>Three neon drones race around a continuous figure-eight circuit, through rotating portals and a glitching central core.</desc>
<defs><radialGradient id="bg"><stop stop-color="#202346"/><stop offset="1" stop-color="#080d19"/></radialGradient><linearGradient id="rail"><stop stop-color="#68fbe1"/><stop offset=".5" stop-color="#a597ff"/><stop offset="1" stop-color="#ffb86c"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter></defs>
<style>
.runner{offset-path:path("M180 250 C180 82 420 82 500 250 C580 418 820 418 820 250 C820 82 580 82 500 250 C420 418 180 418 180 250");offset-rotate:auto;animation:race 24s linear infinite}
.orbit{transform-origin:500px 250px;animation:spin 12s linear infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.core{transform-origin:500px 250px;animation:breathe 6s ease-in-out infinite}
.glitch{animation:glitch 6s steps(1,end) infinite}
@keyframes race{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes tile{0%,100%{opacity:.2}35%{opacity:1}65%{opacity:.25}}
@keyframes glitch{0%,46%,50%,100%{transform:translate(0);opacity:0}47%{transform:translate(-7px,3px);opacity:.8}49%{transform:translate(6px,-2px);opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.runner{offset-distance:18%}.runner:nth-child(2){offset-distance:52%}.runner:nth-child(3){offset-distance:84%}.glitch{display:none}}
*{animation:none!important}.runner{offset-distance:18%}.runner:nth-child(2){offset-distance:52%}.runner:nth-child(3){offset-distance:84%}.glitch{display:none}</style>
